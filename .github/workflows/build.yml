name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen
        run: |
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon && exit 0
            echo "Versuch $i fehlgeschlagen – neuer Versuch in 30 s"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: FotoSync-APK
          path: app/build/outputs/apk/release/*.apk
